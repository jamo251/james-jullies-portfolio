<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">INTERNAL TOOL / MCP SLACK BOT</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Sales Intelligence Slack Bot</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: Slack entry point -->
  <text class="f-muted" x="64" y="178" fill="#5F5F5F" font-size="13" letter-spacing="1.2">WHERE TEAMS WORK</text>
  <rect class="f-bg s-accent" rx="6" x="64" y="194" width="1152" height="92" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="232" fill="#1A7F46" font-size="18" font-weight="600">Slack</text>
  <text class="f-muted" x="84" y="258" fill="#5F5F5F" font-size="12">Sales &amp; CS teams ask in one prompt — no logins, no tab-switching</text>
  <text class="f-heading" x="84" y="276" fill="#111111" font-size="12" font-style="italic">"@bot give me the full picture on Acme — deals, docs, and open tickets"</text>

  <line class="s-accent" x1="640" y1="286" x2="640" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: brain + MCP -->
  <rect class="f-bg s-accent" rx="6" x="64" y="336" width="1152" height="132" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="372" fill="#1A7F46" font-size="18" font-weight="600">Claude API (formerly Gemini Flash) · over MCP</text>
  <text class="f-muted" x="84" y="396" fill="#5F5F5F" font-size="12">Interprets the request, decides which sources to call, reconciles the answer</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="84" y="412" width="358" height="44" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="104" y="440" fill="#111111">Routing &amp; tool selection</text>
    <rect class="f-box s-line" rx="6" x="461" y="412" width="358" height="44" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="481" y="440" fill="#111111">Multi-source synthesis</text>
    <rect class="f-box s-line" rx="6" x="838" y="412" width="358" height="44" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="858" y="440" fill="#111111">Low-latency replies</text>
  </g>

  <!-- Layer 3: three knowledge sources via MCP -->
  <text class="f-muted" x="64" y="488" fill="#5F5F5F" font-size="13" letter-spacing="1.2">KNOWLEDGE SOURCES — EACH AN MCP SERVER</text>

  <line class="s-accent" x1="245" y1="498" x2="245" y2="520" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="498" x2="640" y2="520" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1035" y1="498" x2="1035" y2="520" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="64" y="524" width="362" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="558" fill="#111111" font-size="16" font-weight="600">HubSpot</text>
    <text class="f-muted" x="84" y="584" fill="#5F5F5F" font-size="12">CRM records, deals,</text>
    <text class="f-muted" x="84" y="602" fill="#5F5F5F" font-size="12">pipeline &amp; owner context</text>

    <rect class="f-box s-line" rx="6" x="459" y="524" width="362" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="479" y="558" fill="#111111" font-size="16" font-weight="600">Notion</text>
    <text class="f-muted" x="479" y="584" fill="#5F5F5F" font-size="12">Playbooks, account notes,</text>
    <text class="f-muted" x="479" y="602" fill="#5F5F5F" font-size="12">internal knowledge base</text>

    <rect class="f-box s-line" rx="6" x="854" y="524" width="362" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="874" y="558" fill="#111111" font-size="16" font-weight="600">Zendesk</text>
    <text class="f-muted" x="874" y="584" fill="#5F5F5F" font-size="12">Support history, open</text>
    <text class="f-muted" x="874" y="602" fill="#5F5F5F" font-size="12">tickets &amp; sentiment</text>
  </g>

  <text class="f-muted" x="64" y="692" fill="#5F5F5F" font-size="12">One Slack prompt → live context from three platforms, stitched into a single answer.</text>
</svg>
