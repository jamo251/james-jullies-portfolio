<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">CLAUDE SKILLS / EXAMPLE RUN</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Job description in, tailored CV out</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <g font-size="13">
    <text class="f-muted" x="64" y="180" fill="#5F5F5F" letter-spacing="1.2">01 — TRIGGER</text>
    <rect class="f-box s-line" rx="6" x="64" y="196" width="480" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="232" fill="#111111" font-size="16" font-weight="600">Paste a job posting</text>
    <text class="f-muted" x="84" y="260" fill="#5F5F5F" font-size="12">The request matches the skill's description,</text>
    <text class="f-muted" x="84" y="278" fill="#5F5F5F" font-size="12">so its instructions load automatically.</text>
  </g>
  <line class="s-accent" x1="544" y1="256" x2="728" y2="256" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <g font-size="13">
    <text class="f-muted" x="736" y="180" fill="#5F5F5F" letter-spacing="1.2">02 — GROUND</text>
    <rect class="f-box s-line" rx="6" x="736" y="196" width="480" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="756" y="232" fill="#111111" font-size="16" font-weight="600">Read the master CV</text>
    <text class="f-muted" x="756" y="260" fill="#5F5F5F" font-size="12">Every claim comes from the reference file,</text>
    <text class="f-muted" x="756" y="278" fill="#5F5F5F" font-size="12">so nothing is invented.</text>
  </g>
  <line class="s-accent" x1="976" y1="316" x2="976" y2="388" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="736" y="396" width="480" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="756" y="432" fill="#111111" font-size="16" font-weight="600">03 — Match keywords</text>
    <text class="f-muted" x="756" y="460" fill="#5F5F5F" font-size="12">Mirror the posting's language and reorder</text>
    <text class="f-muted" x="756" y="478" fill="#5F5F5F" font-size="12">achievements by relevance.</text>
  </g>
  <line class="s-accent" x1="736" y1="456" x2="552" y2="456" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <g font-size="13">
    <rect class="f-box s-accent" rx="6" x="64" y="396" width="480" height="120" fill="#F7F7F7" stroke="#1F9D55"/>
    <text class="f-accent-text" x="84" y="432" fill="#1A7F46" font-size="16" font-weight="600">04 — Build the file</text>
    <text class="f-muted" x="84" y="460" fill="#5F5F5F" font-size="12">A script renders an ATS-safe .docx from the</text>
    <text class="f-muted" x="84" y="478" fill="#5F5F5F" font-size="12">template. Same layout every time.</text>
  </g>

  <rect class="f-bg s-accent" rx="6" x="64" y="560" width="1152" height="80" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="596" fill="#1A7F46" font-size="16" font-weight="600">Result</text>
  <text class="f-muted" x="84" y="620" fill="#5F5F5F" font-size="12">A grounded, keyword-matched CV in minutes, not an afternoon of copy-paste.</text>

  <text class="f-muted" x="64" y="692" fill="#5F5F5F" font-size="12">The same pattern powers invoices, interview prep and branded social images.</text>
</svg>
