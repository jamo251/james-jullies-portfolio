<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">SDK CONGRUENCY / BRAZE &#8644; mPARTICLE</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">One Identity, One Event Shape</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Source of truth -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">SINGLE INSTRUMENTATION LAYER</text>
  <rect class="f-box s-line" rx="6" x="64" y="186" width="1152" height="86" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="222" fill="#111111" font-size="18" font-weight="600">App Data Layer — Governed Event Spec</text>
  <text class="f-muted" x="84" y="248" fill="#5F5F5F" font-size="12">Shared identity keys (customer_id / external_id) · canonical event names &amp; properties captured once</text>

  <!-- split arrows -->
  <line class="s-accent" x1="400" y1="272" x2="320" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="880" y1="272" x2="960" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- two SDKs -->
  <rect class="f-bg s-accent" rx="6" x="64" y="336" width="512" height="150" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="372" fill="#1A7F46" font-size="18" font-weight="600">Braze SDK</text>
  <text class="f-muted" x="84" y="396" fill="#5F5F5F" font-size="12">Engagement &amp; messaging</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="3" x="84" y="412" width="472" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="100" y="431" fill="#111111">changeUser(external_id) — same key as mParticle</text>
    <rect class="f-box s-line" rx="3" x="84" y="448" width="472" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="100" y="467" fill="#111111">custom events mirror the canonical spec</text>
  </g>

  <rect class="f-bg s-line-strong" rx="6" x="704" y="336" width="512" height="150" fill="#FFFFFF" stroke="#CFCFCF"/>
  <text class="f-heading" x="724" y="372" fill="#111111" font-size="18" font-weight="600">mParticle SDK</text>
  <text class="f-muted" x="724" y="396" fill="#5F5F5F" font-size="12">CDP · identity &amp; routing</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="3" x="724" y="412" width="472" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="740" y="431" fill="#111111">identify(customer_id) — same key as Braze</text>
    <rect class="f-box s-line" rx="3" x="724" y="448" width="472" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="740" y="467" fill="#111111">forwards matching events downstream</text>
  </g>

  <line class="s-accent" x1="320" y1="486" x2="600" y2="552" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="960" y1="486" x2="680" y2="552" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- reconciled profile -->
  <rect class="f-box s-accent" rx="6" x="320" y="556" width="640" height="80" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="340" y="590" fill="#1A7F46" font-size="16" font-weight="600">Congruent User Profile</text>
  <text class="f-muted" x="340" y="614" fill="#5F5F5F" font-size="12">One user reconciled across both SDKs — no double-counting, no identity drift</text>

  <text class="f-muted" x="64" y="690" fill="#5F5F5F" font-size="12">Advised the bank on SDK congruency so Braze and mParticle, implemented in parallel, stayed in lockstep.</text>
</svg>
