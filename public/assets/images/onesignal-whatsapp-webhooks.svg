<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">WEBHOOKS / WHATSAPP TEMPLATES</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">OneSignal event triggers a WhatsApp template</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect class="f-box s-line" rx="6" x="64" y="300" width="270" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-muted" x="84" y="338" fill="#5F5F5F" font-size="12" letter-spacing="1.2">STEP 1</text>
  <text class="f-heading" x="84" y="368" fill="#111111" font-size="17" font-weight="600">OneSignal</text>
  <text class="f-muted" x="84" y="394" fill="#5F5F5F" font-size="12">Journey / event fires</text>

  <line class="s-accent" x1="334" y1="360" x2="396" y2="360" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect class="f-bg s-accent" rx="6" x="400" y="300" width="270" height="120" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-muted" x="420" y="338" fill="#5F5F5F" font-size="12" letter-spacing="1.2">STEP 2</text>
  <text class="f-accent-text" x="420" y="368" fill="#1A7F46" font-size="17" font-weight="600">Webhook</text>
  <text class="f-muted" x="420" y="394" fill="#5F5F5F" font-size="12">Payload + template params</text>

  <line class="s-accent" x1="670" y1="360" x2="732" y2="360" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect class="f-box s-line" rx="6" x="736" y="300" width="300" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-muted" x="756" y="338" fill="#5F5F5F" font-size="12" letter-spacing="1.2">STEP 3</text>
  <text class="f-heading" x="756" y="368" fill="#111111" font-size="17" font-weight="600">WhatsApp Business Mgr</text>
  <text class="f-muted" x="756" y="394" fill="#5F5F5F" font-size="12">Approved template selected</text>

  <line class="s-accent" x1="1036" y1="360" x2="1098" y2="360" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect class="f-box s-accent" rx="6" x="1040" y="300" width="176" height="120" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-muted" x="1060" y="338" fill="#5F5F5F" font-size="12" letter-spacing="1.2">STEP 4</text>
  <text class="f-heading" x="1060" y="368" fill="#111111" font-size="17" font-weight="600">Customer</text>
  <text class="f-muted" x="1060" y="394" fill="#5F5F5F" font-size="12">Receives message</text>

  <text class="f-heading" x="64" y="520" fill="#111111" font-size="16" font-weight="600">Assisted the webhook → template wiring</text>
  <text class="f-muted" x="64" y="552" fill="#5F5F5F" font-size="13">Connected OneSignal events to the bank's conversational channel, mapping event payloads to the variable</text>
  <text class="f-muted" x="64" y="574" fill="#5F5F5F" font-size="13">parameters of approved WhatsApp Business Manager templates.</text>
</svg>
