<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">CLAUDE SKILLS / ANATOMY OF A SKILL</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">What lives inside a skill</text>

  <!-- File tree -->
  <rect class="f-box s-line" rx="6" x="64" y="160" width="520" height="480" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-muted" x="88" y="200" fill="#5F5F5F" font-size="13" letter-spacing="1.2">FOLDER</text>
  <g font-size="15">
    <text class="f-accent-text mono" x="88" y="244" fill="#1A7F46">tailored-resume/</text>
    <text class="f-heading mono" x="118" y="290" fill="#111111">SKILL.md</text>
    <text class="f-heading mono" x="118" y="336" fill="#111111">references/</text>
    <text class="f-muted mono" x="148" y="372" fill="#5F5F5F">master-cv.md</text>
    <text class="f-muted mono" x="148" y="404" fill="#5F5F5F">ats-rules.md</text>
    <text class="f-heading mono" x="118" y="450" fill="#111111">scripts/</text>
    <text class="f-muted mono" x="148" y="486" fill="#5F5F5F">build_docx.py</text>
    <text class="f-heading mono" x="118" y="532" fill="#111111">assets/</text>
    <text class="f-muted mono" x="148" y="568" fill="#5F5F5F">template.docx</text>
  </g>

  <!-- Explanations -->
  <g font-size="13">
    <rect class="f-bg s-accent" rx="6" x="632" y="160" width="584" height="104" fill="#FFFFFF" stroke="#1F9D55"/>
    <text class="f-accent-text mono" x="656" y="196" fill="#1A7F46" font-size="16" font-weight="600">SKILL.md</text>
    <text class="f-muted" x="656" y="222" fill="#5F5F5F" font-size="12">A trigger description (when to use it) plus the step-by-step</text>
    <text class="f-muted" x="656" y="242" fill="#5F5F5F" font-size="12">instructions Claude follows once it does.</text>

    <rect class="f-box s-line" rx="6" x="632" y="284" width="584" height="104" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading mono" x="656" y="320" fill="#111111" font-size="16" font-weight="600">references/</text>
    <text class="f-muted" x="656" y="346" fill="#5F5F5F" font-size="12">Source-of-truth facts and rules, read only when needed so</text>
    <text class="f-muted" x="656" y="366" fill="#5F5F5F" font-size="12">the context window stays lean.</text>

    <rect class="f-box s-line" rx="6" x="632" y="408" width="584" height="104" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading mono" x="656" y="444" fill="#111111" font-size="16" font-weight="600">scripts/</text>
    <text class="f-muted" x="656" y="470" fill="#5F5F5F" font-size="12">Deterministic code for the parts a model shouldn't improvise:</text>
    <text class="f-muted" x="656" y="490" fill="#5F5F5F" font-size="12">file formats, layout, totals.</text>

    <rect class="f-box s-line" rx="6" x="632" y="532" width="584" height="108" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading mono" x="656" y="568" fill="#111111" font-size="16" font-weight="600">assets/</text>
    <text class="f-muted" x="656" y="594" fill="#5F5F5F" font-size="12">Templates, logos and fonts, so output is on-brand by</text>
    <text class="f-muted" x="656" y="614" fill="#5F5F5F" font-size="12">default instead of by luck.</text>
  </g>

  <text class="f-muted" x="64" y="692" fill="#5F5F5F" font-size="12">Instructions, facts, code and assets in one folder: portable, versioned, reusable.</text>
</svg>
