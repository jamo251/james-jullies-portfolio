<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">DATA FLOW / SDK · API · WEBHOOKS</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Braze Integration Surface</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Left: client apps -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">CLIENT APPLICATIONS</text>
  <rect class="f-box s-line" rx="6" x="64" y="186" width="300" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="222" fill="#111111" font-size="17" font-weight="600">Mobile &amp; Web Apps</text>
  <text class="f-muted" x="84" y="248" fill="#5F5F5F" font-size="12">iOS · Android · Web</text>
  <text class="f-muted" x="84" y="270" fill="#5F5F5F" font-size="12">Banking &amp; lending flows</text>

  <rect class="f-box s-line" rx="6" x="64" y="330" width="300" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="366" fill="#111111" font-size="17" font-weight="600">Backend Services</text>
  <text class="f-muted" x="84" y="392" fill="#5F5F5F" font-size="12">Server-to-server events</text>
  <text class="f-muted" x="84" y="414" fill="#5F5F5F" font-size="12">Identity &amp; attributes</text>

  <!-- arrows into Braze -->
  <line class="s-accent" x1="364" y1="246" x2="500" y2="300" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <text class="f-muted" x="372" y="262" fill="#5F5F5F" font-size="11">SDK ingest</text>
  <line class="s-accent" x1="364" y1="390" x2="500" y2="340" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <text class="f-muted" x="372" y="416" fill="#5F5F5F" font-size="11">REST API</text>

  <!-- Center: Braze -->
  <rect class="f-bg s-accent" rx="6" x="508" y="240" width="264" height="160" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="528" y="278" fill="#1A7F46" font-size="18" font-weight="600">Braze</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="528" y="296" width="224" height="40" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="548" y="321" fill="#111111">SDK · user sessions</text>
    <rect class="f-box s-line" rx="6" x="528" y="344" width="224" height="40" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="548" y="369" fill="#111111">REST · /users/track</text>
  </g>

  <!-- right: messaging + webhooks -->
  <line class="s-accent" x1="772" y1="320" x2="908" y2="246" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <text class="f-muted" x="784" y="276" fill="#5F5F5F" font-size="11">campaigns</text>
  <line class="s-accent" x1="772" y1="320" x2="908" y2="390" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <text class="f-muted" x="784" y="372" fill="#5F5F5F" font-size="11">webhook</text>

  <text class="f-muted" x="916" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">ACTIVATION</text>
  <rect class="f-box s-line" rx="6" x="916" y="186" width="300" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="936" y="222" fill="#111111" font-size="17" font-weight="600">Canvas &amp; Campaigns</text>
  <text class="f-muted" x="936" y="248" fill="#5F5F5F" font-size="12">Push · in-app · email</text>
  <text class="f-muted" x="936" y="270" fill="#5F5F5F" font-size="12">Lifecycle journeys</text>

  <rect class="f-box s-line" rx="6" x="916" y="330" width="300" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="936" y="366" fill="#111111" font-size="17" font-weight="600">Webhook Targets</text>
  <text class="f-muted" x="936" y="392" fill="#5F5F5F" font-size="12">External SMS triggering</text>
  <text class="f-muted" x="936" y="414" fill="#5F5F5F" font-size="12">Partner &amp; internal APIs</text>

  <text class="f-muted" x="64" y="510" fill="#5F5F5F" font-size="13" letter-spacing="1.2">DELIVERY GUARANTEES</text>
  <rect class="f-bg s-line" rx="6" x="64" y="526" width="1152" height="120" fill="#FFFFFF" stroke="#E4E4E4"/>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="84" y="548" width="358" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="104" y="582" fill="#1A7F46">SDK ↔ API parity</text>
    <text class="f-muted" x="104" y="606" fill="#5F5F5F" font-size="12">Same user, same external_id everywhere</text>
    <rect class="f-box s-line" rx="6" x="461" y="548" width="358" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="481" y="582" fill="#1A7F46">Idempotent events</text>
    <text class="f-muted" x="481" y="606" fill="#5F5F5F" font-size="12">Safe retries · no duplicate counts</text>
    <rect class="f-box s-line" rx="6" x="838" y="548" width="358" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="858" y="582" fill="#1A7F46">Webhook reliability</text>
    <text class="f-muted" x="858" y="606" fill="#5F5F5F" font-size="12">Auth, payload contracts, failure handling</text>
  </g>

  <text class="f-muted" x="64" y="694" fill="#5F5F5F" font-size="12">Led technical sessions covering the SDK, REST API, and webhook architecture end to end.</text>
</svg>
