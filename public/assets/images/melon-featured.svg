<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">TECHNICAL ARCHITECTURE / AMPLITUDE + APPSFLYER</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Amplitude &amp; AppsFlyer Dual Implementation</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: four platforms -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">MELON MOBILE — FOUR PLATFORMS</text>
  <g>
    <rect class="f-box s-line" rx="6" x="64" y="186" width="270" height="70" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="216" fill="#111111" font-size="17" font-weight="600">Android</text>
    <text class="f-muted" x="84" y="238" fill="#5F5F5F" font-size="12">Google Play Services</text>

    <rect class="f-box s-line" rx="6" x="358" y="186" width="270" height="70" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="378" y="216" fill="#111111" font-size="17" font-weight="600">iOS</text>
    <text class="f-muted" x="378" y="238" fill="#5F5F5F" font-size="12">App Store</text>

    <rect class="f-box s-line" rx="6" x="652" y="186" width="270" height="70" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="672" y="216" fill="#111111" font-size="17" font-weight="600">Huawei</text>
    <text class="f-muted" x="672" y="238" fill="#5F5F5F" font-size="12">HMS · AppGallery, no GMS</text>

    <rect class="f-box s-line" rx="6" x="946" y="186" width="270" height="70" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="966" y="216" fill="#111111" font-size="17" font-weight="600">Web</text>
    <text class="f-muted" x="966" y="238" fill="#5F5F5F" font-size="12">Browser SDKs</text>
  </g>

  <line class="s-accent" x1="199" y1="256" x2="199" y2="296" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="493" y1="256" x2="493" y2="296" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="787" y1="256" x2="787" y2="296" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1081" y1="256" x2="1081" y2="296" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: firing order -->
  <rect class="f-box s-accent" rx="6" x="64" y="300" width="1152" height="74" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="332" fill="#1A7F46" font-size="17" font-weight="600">SDK Firing Order</text>
  <text class="f-muted" x="84" y="356" fill="#5F5F5F" font-size="12">Amplitude init → device_id handed to AppsFlyer → login → customer_id set on both SDKs</text>

  <line class="s-accent" x1="400" y1="374" x2="340" y2="420" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="880" y1="374" x2="940" y2="420" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: two platforms -->
  <rect class="f-bg s-line-strong" rx="6" x="64" y="424" width="552" height="96" fill="#FFFFFF" stroke="#CFCFCF"/>
  <text class="f-heading" x="84" y="462" fill="#111111" font-size="18" font-weight="600">Amplitude</text>
  <text class="f-muted" x="84" y="488" fill="#5F5F5F" font-size="12">Product analytics · what users do</text>

  <rect class="f-bg s-line-strong" rx="6" x="664" y="424" width="552" height="96" fill="#FFFFFF" stroke="#CFCFCF"/>
  <text class="f-heading" x="684" y="462" fill="#111111" font-size="18" font-weight="600">AppsFlyer</text>
  <text class="f-muted" x="684" y="488" fill="#5F5F5F" font-size="12">Attribution · where users come from</text>

  <line class="s-accent" x1="340" y1="520" x2="600" y2="566" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="940" y1="520" x2="680" y2="566" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 4: single customer view -->
  <rect class="f-box s-accent" rx="6" x="320" y="570" width="640" height="76" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="340" y="602" fill="#1A7F46" font-size="16" font-weight="600">Single Customer View</text>
  <text class="f-muted" x="340" y="626" fill="#5F5F5F" font-size="12">Acquisition and behaviour on one profile, on every platform</text>

  <text class="f-muted" x="64" y="692" fill="#5F5F5F" font-size="12">Designed the taxonomy with the marketing agency and took a phased rollout live on time.</text>
</svg>
