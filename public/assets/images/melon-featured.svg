<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1280" height="720" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#D9FF4B" stroke-opacity="0.12"/>

  <text x="64" y="68" fill="#86868B" font-size="14" letter-spacing="4">TECHNICAL ARCHITECTURE / AMPLITUDE + APPSFLYER</text>
  <text x="64" y="110" fill="#F2F1ED" font-size="34" font-weight="600">Amplitude &amp; AppsFlyer Dual Implementation</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D9FF4B" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- Layer 1: four platforms -->
  <text x="64" y="170" fill="#86868B" font-size="13" letter-spacing="2">MELON MOBILE — FOUR PLATFORMS</text>
  <g>
    <rect x="64" y="186" width="270" height="70" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
    <text x="84" y="216" fill="#F2F1ED" font-size="17" font-weight="600">Android</text>
    <text x="84" y="238" fill="#86868B" font-size="12">Google Play Services</text>

    <rect x="358" y="186" width="270" height="70" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
    <text x="378" y="216" fill="#F2F1ED" font-size="17" font-weight="600">iOS</text>
    <text x="378" y="238" fill="#86868B" font-size="12">App Store</text>

    <rect x="652" y="186" width="270" height="70" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
    <text x="672" y="216" fill="#F2F1ED" font-size="17" font-weight="600">Huawei</text>
    <text x="672" y="238" fill="#86868B" font-size="12">HMS · AppGallery, no GMS</text>

    <rect x="946" y="186" width="270" height="70" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
    <text x="966" y="216" fill="#F2F1ED" font-size="17" font-weight="600">Web</text>
    <text x="966" y="238" fill="#86868B" font-size="12">Browser SDKs</text>
  </g>

  <line x1="199" y1="256" x2="199" y2="296" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="493" y1="256" x2="493" y2="296" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="787" y1="256" x2="787" y2="296" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="1081" y1="256" x2="1081" y2="296" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: firing order -->
  <rect x="64" y="300" width="1152" height="74" fill="#141416" stroke="#D9FF4B" stroke-opacity="0.35"/>
  <text x="84" y="332" fill="#D9FF4B" font-size="17" font-weight="600">SDK Firing Order</text>
  <text x="84" y="356" fill="#86868B" font-size="12">Amplitude init → device_id handed to AppsFlyer → login → customer_id set on both SDKs</text>

  <line x1="400" y1="374" x2="340" y2="420" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="374" x2="940" y2="420" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: two platforms -->
  <rect x="64" y="424" width="552" height="96" fill="#0A0A0B" stroke="#F2F1ED" stroke-opacity="0.25"/>
  <text x="84" y="462" fill="#F2F1ED" font-size="18" font-weight="600">Amplitude</text>
  <text x="84" y="488" fill="#86868B" font-size="12">Product analytics · what users do</text>

  <rect x="664" y="424" width="552" height="96" fill="#0A0A0B" stroke="#F2F1ED" stroke-opacity="0.25"/>
  <text x="684" y="462" fill="#F2F1ED" font-size="18" font-weight="600">AppsFlyer</text>
  <text x="684" y="488" fill="#86868B" font-size="12">Attribution · where users come from</text>

  <line x1="340" y1="520" x2="600" y2="566" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="520" x2="680" y2="566" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: single customer view -->
  <rect x="320" y="570" width="640" height="76" fill="#141416" stroke="#D9FF4B" stroke-opacity="0.35"/>
  <text x="340" y="602" fill="#D9FF4B" font-size="16" font-weight="600">Single Customer View</text>
  <text x="340" y="626" fill="#86868B" font-size="12">Acquisition and behaviour on one profile, on every platform</text>

  <text x="64" y="692" fill="#86868B" font-size="12">Designed the taxonomy with the marketing agency and took a phased rollout live on time.</text>
</svg>
