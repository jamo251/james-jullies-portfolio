<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">TECHNICAL ARCHITECTURE / ONESIGNAL</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">OneSignal Migration &amp; Messaging Architecture</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: existing estate -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">BANCO MILLENNIUM ATLÂNTICO — EXISTING ESTATE</text>
  <g>
    <rect class="f-box s-line" rx="6" x="64" y="186" width="556" height="86" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="224" fill="#111111" font-size="18" font-weight="600">MS Dynamics 365</text>
    <text class="f-muted" x="84" y="250" fill="#5F5F5F" font-size="12">Migrating off — customer engagement stack</text>

    <rect class="f-box s-line" rx="6" x="660" y="186" width="556" height="86" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="680" y="224" fill="#111111" font-size="18" font-weight="600">Existing OneSignal (2024)</text>
    <text class="f-muted" x="680" y="250" fill="#5F5F5F" font-size="12">Prior install · SDKs to be uplifted</text>
  </g>

  <line class="s-accent" x1="342" y1="272" x2="500" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="938" y1="272" x2="780" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

