    <text class="f-muted" x="104" y="476" fill="#5F5F5F" font-size="12">Web · iOS · Android — re-wired</text>

    <rect class="f-box s-line" rx="6" x="450" y="418" width="350" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
