    <text class="f-muted" x="470" y="476" fill="#5F5F5F" font-size="12">Users · events · messaging</text>

    <rect class="f-box s-line" rx="6" x="816" y="418" width="400" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="836" y="452" fill="#111111" font-weight="600">Webhooks</text>
    <text class="f-muted" x="836" y="476" fill="#5F5F5F" font-size="12">External triggers · WhatsApp · SMS</text>
  </g>

  <line class="s-accent" x1="640" y1="508" x2="380" y2="556" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="508" x2="985" y2="556" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: channels -->
  <rect class="f-box s-line" rx="6" x="64" y="560" width="462" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="594" fill="#111111" font-size="16" font-weight="600">WhatsApp Business Manager</text>
  <text class="f-muted" x="84" y="618" fill="#5F5F5F" font-size="12">Webhook triggers approved</text>
  <text class="f-muted" x="84" y="636" fill="#5F5F5F" font-size="12">message templates</text>

  <rect class="f-box s-line" rx="6" x="754" y="560" width="462" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="774" y="594" fill="#111111" font-size="16" font-weight="600">SOAP SMS Infrastructure</text>
