<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">SDK FIRING SEQUENCE / IDENTITY</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Anonymous to Known, in Order</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- stage labels -->
  <text class="f-muted" x="220" y="152" fill="#5F5F5F" font-size="12">ANONYMOUS — linked from first open</text>
  <text class="f-muted" x="808" y="152" fill="#5F5F5F" font-size="12">KNOWN — customer_id on both SDKs</text>

  <!-- swimlanes -->
  <rect class="f-bg s-line" rx="6" x="64" y="166" width="1152" height="88" fill="#FFFFFF" stroke="#E4E4E4"/>
  <rect class="f-bg s-line" rx="6" x="64" y="276" width="1152" height="88" fill="#FFFFFF" stroke="#E4E4E4"/>
  <rect class="f-bg s-line" rx="6" x="64" y="386" width="1152" height="88" fill="#FFFFFF" stroke="#E4E4E4"/>
  <g class="f-muted" fill="#5F5F5F" font-size="13" letter-spacing="1">
    <text x="84" y="215">APP</text>
    <text x="84" y="325">AMPLITUDE</text>
    <text x="84" y="435">APPSFLYER</text>
  </g>

  <!-- step 1: app open -->
  <rect class="f-box s-line" rx="6" x="220" y="174" width="170" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-accent-text" x="234" y="194" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 1</text>
  <text class="f-heading" x="234" y="214" fill="#111111" font-size="13" font-weight="600">App open</text>
  <text class="f-muted" x="234" y="234" fill="#5F5F5F" font-size="12">first launch</text>

  <!-- step 2: amplitude init -->
  <rect class="f-box s-line" rx="6" x="416" y="284" width="170" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-accent-text" x="430" y="304" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 2</text>
  <text class="f-heading mono" x="430" y="324" fill="#111111" font-size="13" font-weight="600">init()</text>
  <text class="f-muted" x="430" y="344" fill="#5F5F5F" font-size="12">device_id created</text>

  <!-- step 3: appsflyer init -->
  <rect class="f-box s-accent" rx="6" x="612" y="394" width="170" height="72" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="626" y="414" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 3</text>
  <text class="f-heading mono" x="626" y="434" fill="#111111" font-size="13" font-weight="600">init()</text>
  <text class="f-muted" x="626" y="454" fill="#5F5F5F" font-size="12">with Amp device_id</text>

  <!-- step 4: login -->
  <rect class="f-box s-line" rx="6" x="808" y="174" width="170" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-accent-text" x="822" y="194" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 4</text>
  <text class="f-heading" x="822" y="214" fill="#111111" font-size="13" font-weight="600">Login / register</text>
  <text class="f-muted" x="822" y="234" fill="#5F5F5F" font-size="12">customer_id known</text>

  <!-- step 5: set ids on both -->
  <rect class="f-box s-accent" rx="6" x="1004" y="284" width="170" height="72" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="1018" y="304" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 5</text>
  <text class="f-heading mono" x="1018" y="324" fill="#111111" font-size="13" font-weight="600">setUserId</text>
  <text class="f-muted mono" x="1018" y="344" fill="#5F5F5F" font-size="12">(customer_id)</text>

  <rect class="f-box s-accent" rx="6" x="1004" y="394" width="170" height="72" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="1018" y="414" fill="#1A7F46" font-size="11" letter-spacing="1.2">STEP 5</text>
  <text class="f-heading mono" x="1018" y="434" fill="#111111" font-size="13" font-weight="600">setCustomerUserId</text>
  <text class="f-muted mono" x="1018" y="454" fill="#5F5F5F" font-size="12">(customer_id)</text>

  <!-- flow -->
  <g class="s-accent" fill="none" stroke="#1F9D55" stroke-opacity="0.8">
    <path d="M390,210 H403 V320 H412" marker-end="url(#arrow)"/>
    <path d="M586,320 H599 V430 H608" marker-end="url(#arrow)"/>
    <path d="M782,430 H795 V210 H804" marker-end="url(#arrow)"/>
    <path d="M978,210 H991 V430 H1000" marker-end="url(#arrow)"/>
    <path d="M991,320 H1000" marker-end="url(#arrow)"/>
    <line x1="1089" y1="466" x2="1089" y2="504" marker-end="url(#arrow)"/>
  </g>

  <!-- merged profile -->
  <rect class="f-box s-accent" rx="6" x="64" y="508" width="1152" height="80" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="542" fill="#1A7F46" font-size="16" font-weight="600">Merged Customer Profile</text>
  <text class="f-muted" x="84" y="566" fill="#5F5F5F" font-size="12">Anonymous history from first open joins the known customer, in Amplitude and AppsFlyer alike</text>

  <text class="f-heading" x="64" y="630" fill="#111111" font-size="12">Order matters: AppsFlyer needs Amplitude's device_id at init, or the install can't be tied to in-app sessions.</text>
  <text class="f-muted" x="64" y="690" fill="#5F5F5F" font-size="12">Same sequence on Android, iOS, Huawei and web.</text>
</svg>
