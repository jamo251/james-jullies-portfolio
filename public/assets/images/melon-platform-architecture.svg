<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">SOLUTION ARCHITECTURE / DATA FLOW</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Two SDKs on Every Platform</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <g class="f-muted" fill="#5F5F5F" font-size="13" letter-spacing="1.2">
    <text x="64" y="152">PLATFORM</text>
    <text x="360" y="152">SDKs · SAME TAXONOMY</text>
    <text x="900" y="152">DESTINATION</text>
  </g>

  <!-- platform rows -->
  <g>
    <rect class="f-box s-line" rx="6" x="64" y="166" width="260" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="200" fill="#111111" font-size="17" font-weight="600">Android</text>
    <text class="f-muted" x="84" y="224" fill="#5F5F5F" font-size="12">Google Play Services</text>

    <rect class="f-box s-line" rx="6" x="64" y="262" width="260" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="296" fill="#111111" font-size="17" font-weight="600">iOS</text>
    <text class="f-muted" x="84" y="320" fill="#5F5F5F" font-size="12">App Store</text>

    <rect class="f-box s-line" rx="6" x="64" y="358" width="260" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="392" fill="#111111" font-size="17" font-weight="600">Huawei</text>
    <text class="f-muted" x="84" y="416" fill="#5F5F5F" font-size="12">HMS · no GMS</text>

    <rect class="f-box s-line" rx="6" x="64" y="454" width="260" height="80" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="488" fill="#111111" font-size="17" font-weight="600">Web</text>
    <text class="f-muted" x="84" y="512" fill="#5F5F5F" font-size="12">Browser</text>
  </g>

  <!-- sdk pills -->
  <g font-size="13">
    <rect class="f-box s-line" rx="3" x="360" y="174" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="193" fill="#111111">Amplitude SDK</text>
    <rect class="f-box s-line" rx="3" x="360" y="210" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="229" fill="#111111">AppsFlyer SDK</text>

    <rect class="f-box s-line" rx="3" x="360" y="270" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="289" fill="#111111">Amplitude SDK</text>
    <rect class="f-box s-line" rx="3" x="360" y="306" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="325" fill="#111111">AppsFlyer SDK</text>

    <rect class="f-box s-line" rx="3" x="360" y="366" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="385" fill="#111111">Amplitude SDK</text>
    <rect class="f-box s-line" rx="3" x="360" y="402" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="421" fill="#111111">AppsFlyer SDK · HMS build</text>

    <rect class="f-box s-line" rx="3" x="360" y="462" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="481" fill="#111111">Amplitude Browser SDK</text>
    <rect class="f-box s-line" rx="3" x="360" y="498" width="440" height="28" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="376" y="517" fill="#111111">AppsFlyer Web SDK</text>
  </g>

  <!-- buses -->
  <g class="s-accent" fill="none" stroke="#1F9D55" stroke-opacity="0.8">
    <path d="M800,188 H840 M800,284 H840 M800,380 H840 M800,476 H840 M840,188 V476"/>
    <path d="M800,224 H868 M800,320 H868 M800,416 H868 M800,512 H868 M868,224 V512"/>
  </g>
  <g class="s-accent" stroke="#1F9D55" stroke-opacity="0.8">
    <line x1="840" y1="254" x2="896" y2="254" marker-end="url(#arrow)"/>
    <line x1="868" y1="446" x2="896" y2="446" marker-end="url(#arrow)"/>
  </g>

  <!-- destinations -->
  <rect class="f-bg s-line-strong" rx="6" x="900" y="166" width="316" height="176" fill="#FFFFFF" stroke="#CFCFCF"/>
  <text class="f-heading" x="920" y="202" fill="#111111" font-size="18" font-weight="600">Amplitude</text>
  <text class="f-muted" x="920" y="226" fill="#5F5F5F" font-size="12">Product analytics</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="3" x="920" y="244" width="276" height="34" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="936" y="266" fill="#1A7F46">Funnels &amp; retention</text>
    <rect class="f-box s-line" rx="3" x="920" y="288" width="276" height="34" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="936" y="310" fill="#1A7F46">Journeys by source</text>
  </g>

  <rect class="f-bg s-line-strong" rx="6" x="900" y="358" width="316" height="176" fill="#FFFFFF" stroke="#CFCFCF"/>
  <text class="f-heading" x="920" y="394" fill="#111111" font-size="18" font-weight="600">AppsFlyer</text>
  <text class="f-muted" x="920" y="418" fill="#5F5F5F" font-size="12">Attribution</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="3" x="920" y="436" width="276" height="34" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="936" y="458" fill="#1A7F46">Install attribution</text>
    <rect class="f-box s-line" rx="3" x="920" y="480" width="276" height="34" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="936" y="502" fill="#1A7F46">Campaign measurement</text>
  </g>

  <!-- identity layer -->
  <rect class="f-box s-accent" rx="6" x="64" y="564" width="1152" height="74" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="596" fill="#1A7F46" font-size="17" font-weight="600">Shared Identity Keys</text>
  <text class="f-muted" x="84" y="620" fill="#5F5F5F" font-size="12">Amplitude device_id passed to AppsFlyer at init · customer_id set on both at login · same keys on all four platforms</text>

  <text class="f-muted" x="64" y="690" fill="#5F5F5F" font-size="12">One event spec, designed with the marketing agency, instrumented identically everywhere.</text>
</svg>
