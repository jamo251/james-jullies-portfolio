  <text x="84" y="596" fill="#D9FF4B" font-size="17" font-weight="600">Shared Identity Keys</text>
  <text x="84" y="620" fill="#86868B" font-size="12">Amplitude device_id passed to AppsFlyer at init · customer_id set on both at login · same keys on all four platforms</text>

