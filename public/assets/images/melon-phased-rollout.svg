<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1280" height="720" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#D9FF4B" stroke-opacity="0.12"/>

  <text x="64" y="68" fill="#86868B" font-size="14" letter-spacing="4">DELIVERY / PHASED ROLLOUT</text>
  <text x="64" y="110" fill="#F2F1ED" font-size="34" font-weight="600">Foundation First, Live on Time</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D9FF4B" fill-opacity="0.7"/>
    </marker>
  </defs>

  <text x="64" y="170" fill="#86868B" font-size="13" letter-spacing="2">SCOPED WITH MELON MOBILE AND ITS MARKETING AGENCY</text>

  <!-- phase 1 -->
  <rect x="64" y="190" width="360" height="250" fill="#141416" stroke="#D9FF4B" stroke-opacity="0.35"/>
  <text x="88" y="230" fill="#D9FF4B" font-size="13" letter-spacing="2">PHASE 01</text>
  <text x="88" y="266" fill="#F2F1ED" font-size="22" font-weight="600">Foundation</text>
  <line x1="88" y1="286" x2="400" y2="286" stroke="#F2F1ED" stroke-opacity="0.12"/>
  <g font-size="13" fill="#F2F1ED">
    <rect x="88" y="311" width="6" height="6" fill="#D9FF4B"/><text x="106" y="320">Event taxonomy agreed</text>
    <rect x="88" y="351" width="6" height="6" fill="#D9FF4B"/><text x="106" y="360">SDK firing order + identity</text>
    <rect x="88" y="391" width="6" height="6" fill="#D9FF4B"/><text x="106" y="400">Core events on all 4 platforms</text>
  </g>

  <!-- phase 2 -->
  <rect x="460" y="190" width="360" height="250" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
  <text x="484" y="230" fill="#D9FF4B" font-size="13" letter-spacing="2">PHASE 02</text>
  <text x="484" y="266" fill="#F2F1ED" font-size="22" font-weight="600">Build out</text>
  <line x1="484" y1="286" x2="796" y2="286" stroke="#F2F1ED" stroke-opacity="0.12"/>
  <g font-size="13" fill="#F2F1ED">
    <rect x="484" y="311" width="6" height="6" fill="#D9FF4B"/><text x="502" y="320">Further journeys instrumented</text>
    <rect x="484" y="351" width="6" height="6" fill="#D9FF4B"/><text x="502" y="360">Built on the verified base</text>
    <rect x="484" y="391" width="6" height="6" fill="#D9FF4B"/><text x="502" y="400">Validated on every platform</text>
  </g>

  <!-- phase 3 -->
  <rect x="856" y="190" width="360" height="250" fill="#141416" stroke="#F2F1ED" stroke-opacity="0.12"/>
  <text x="880" y="230" fill="#D9FF4B" font-size="13" letter-spacing="2">PHASE 03</text>
  <text x="880" y="266" fill="#F2F1ED" font-size="22" font-weight="600">Go-live</text>
  <line x1="880" y1="286" x2="1192" y2="286" stroke="#F2F1ED" stroke-opacity="0.12"/>
  <g font-size="13" fill="#F2F1ED">
    <rect x="880" y="311" width="6" height="6" fill="#D9FF4B"/><text x="898" y="320">Data checked in both tools</text>
    <rect x="880" y="351" width="6" height="6" fill="#D9FF4B"/><text x="898" y="360">Reporting for marketing</text>
    <rect x="880" y="391" width="6" height="6" fill="#D9FF4B"/><text x="898" y="400">Reporting for product</text>
  </g>

  <!-- timeline -->
  <line x1="64" y1="506" x2="1206" y2="506" stroke="#D9FF4B" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <circle cx="244" cy="506" r="6" fill="#0A0A0B" stroke="#D9FF4B"/>
  <circle cx="640" cy="506" r="6" fill="#0A0A0B" stroke="#D9FF4B"/>
  <circle cx="1036" cy="506" r="6" fill="#D9FF4B"/>
  <text x="64" y="542" fill="#86868B" font-size="12" letter-spacing="2">KICK-OFF</text>
  <text x="1216" y="542" fill="#D9FF4B" font-size="14" letter-spacing="2" text-anchor="end">GO-LIVE — ON TIME</text>

  <text x="64" y="640" fill="#86868B" font-size="12">Identity landed first, so every later phase built on data both platforms already agreed on.</text>
</svg>
