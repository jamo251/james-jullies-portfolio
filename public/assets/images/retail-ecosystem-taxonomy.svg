<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Header -->
  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">EVENT TAXONOMY / CHECKOUT JOURNEY</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Checkout Tracking Spec</text>
  <text class="f-muted" x="64" y="138" fill="#5F5F5F" font-size="14">Object–Action naming · one governed spec serves all three brands via the <tspan class="f-accent-text" fill="#1A7F46">brand</tspan> property</text>

  <!-- Table header -->
  <line class="s-line" x1="64" y1="166" x2="1216" y2="166" stroke="#E4E4E4"/>
  <text class="f-muted" x="76" y="194" fill="#5F5F5F" font-size="13" letter-spacing="1.2">EVENT NAME</text>
  <text class="f-muted" x="470" y="194" fill="#5F5F5F" font-size="13" letter-spacing="1.2">TRIGGER</text>
  <text class="f-muted" x="800" y="194" fill="#5F5F5F" font-size="13" letter-spacing="1.2">KEY PROPERTIES</text>
  <line class="s-line" x1="64" y1="210" x2="1216" y2="210" stroke="#E4E4E4"/>

  <!-- Rows -->
  <!-- helper: rows every 62px starting y=210 -->
  <g font-size="15">
    <!-- Row 1 -->
    <rect class="f-box" rx="6" x="64" y="210" width="1152" height="62" fill="#F7F7F7"/>
    <text class="f-accent-text" x="76" y="248" fill="#1A7F46" font-weight="600">Product Viewed</text>
    <text class="f-heading" x="470" y="248" fill="#111111">PDP load</text>
    <text class="f-muted" x="800" y="248" fill="#5F5F5F" font-size="13">brand · product_id · category · price · currency</text>

    <!-- Row 2 -->
    <rect class="f-bg" rx="6" x="64" y="272" width="1152" height="62" fill="#FFFFFF"/>
    <text class="f-accent-text" x="76" y="310" fill="#1A7F46" font-weight="600">Product Added</text>
    <text class="f-heading" x="470" y="310" fill="#111111">Add-to-cart click</text>
    <text class="f-muted" x="800" y="310" fill="#5F5F5F" font-size="13">brand · product_id · quantity · price · cart_value</text>

    <!-- Row 3 -->
    <rect class="f-box" rx="6" x="64" y="334" width="1152" height="62" fill="#F7F7F7"/>
    <text class="f-accent-text" x="76" y="372" fill="#1A7F46" font-weight="600">Cart Viewed</text>
    <text class="f-heading" x="470" y="372" fill="#111111">Cart / mini-cart open</text>
    <text class="f-muted" x="800" y="372" fill="#5F5F5F" font-size="13">brand · cart_value · item_count · currency</text>

    <!-- Row 4 -->
    <rect class="f-bg" rx="6" x="64" y="396" width="1152" height="62" fill="#FFFFFF"/>
    <text class="f-accent-text" x="76" y="434" fill="#1A7F46" font-weight="600">Checkout Started</text>
    <text class="f-heading" x="470" y="434" fill="#111111">Begin checkout</text>
    <text class="f-muted" x="800" y="434" fill="#5F5F5F" font-size="13">brand · cart_value · item_count · coupon</text>

    <!-- Row 5 -->
    <rect class="f-box" rx="6" x="64" y="458" width="1152" height="62" fill="#F7F7F7"/>
    <text class="f-accent-text" x="76" y="496" fill="#1A7F46" font-weight="600">Shipping Info Completed</text>
    <text class="f-heading" x="470" y="496" fill="#111111">Shipping step submit</text>
    <text class="f-muted" x="800" y="496" fill="#5F5F5F" font-size="13">brand · shipping_method · cart_value</text>

    <!-- Row 6 (highlighted - the drop step) -->
    <rect class="f-box" rx="6" x="64" y="520" width="1152" height="62" fill="#F7F7F7"/>
    <rect class="f-warn" rx="3" x="64" y="520" width="6" height="62" fill="#C2410C" fill-opacity="0.7"/>
    <text class="f-accent-text" x="76" y="558" fill="#1A7F46" font-weight="600">Payment Info Entered</text>
    <text class="f-heading" x="470" y="558" fill="#111111">Payment step submit</text>
    <text class="f-muted" x="800" y="558" fill="#5F5F5F" font-size="13">brand · payment_method · cart_value</text>

    <!-- Row 7 -->
    <rect class="f-bg" rx="6" x="64" y="582" width="1152" height="62" fill="#FFFFFF"/>
    <text class="f-accent-text" x="76" y="620" fill="#1A7F46" font-weight="600">Order Completed</text>
    <text class="f-heading" x="470" y="620" fill="#111111">Order confirmation</text>
    <text class="f-muted" x="800" y="620" fill="#5F5F5F" font-size="13">brand · order_id · revenue · payment_method · currency</text>
  </g>

  <line class="s-line" x1="64" y1="644" x2="1216" y2="644" stroke="#E4E4E4"/>
  <text class="f-muted" x="64" y="676" fill="#5F5F5F" font-size="13">SHARED PROPERTY — <tspan class="f-accent-text" fill="#1A7F46">brand</tspan> distinguishes storefronts inside a single schema; no per-brand event forks, consistent governance.</text>
</svg>
