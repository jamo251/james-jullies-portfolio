<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --line:#E4E4E4; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-fill:#1F9D55; --box:#F7F7F7; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --line:#2C2C2E; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-fill:#1F9D55; --box:#18181A; --warn:#FB923C; }
    }
    .bg{fill:var(--bg)} .frame{fill:none;stroke:var(--line)} .eyebrow{fill:var(--muted)} .title{fill:var(--heading)}
    .muted{fill:var(--muted)} .rule{fill:var(--accent)} .bar{fill:var(--accent-fill)} .track{fill:var(--box);stroke:var(--line)}
    .warn{fill:var(--warn)} .label{fill:var(--heading)}
  </style>
  <rect class="bg" width="1600" height="900" fill="#FFFFFF"/>
  <text class="eyebrow" x="80" y="287" font-size="22" letter-spacing="2">DATA CASE STUDY</text>
  <text class="title" x="80" y="377" font-size="68" font-weight="600" letter-spacing="-1.4">One analytics</text>
  <text class="title" x="80" y="455" font-size="68" font-weight="600" letter-spacing="-1.4">language</text>
  <rect class="rule" x="80" y="505" width="80" height="4"/>
  <text class="muted" x="80" y="571" font-size="26">Amplitude · SFCC · Funnels</text>
  <text class="eyebrow" x="720" y="190" font-size="18" letter-spacing="1.6">CHECKOUT CONVERSION · ALL THREE BRANDS</text>
  <rect class="track" x="720" y="220" width="800" height="76" rx="6" fill="#F7F7F7" stroke="#E4E4E4"/>
  <rect class="bar" x="720" y="220" width="800" height="76" rx="6" fill="#1F9D55" fill-opacity="0.9"/>
  <text class="label" x="740" y="267" font-size="24" font-weight="600">Cart viewed</text>
  <text class="label" x="1500" y="267" font-size="24" font-weight="600" text-anchor="end">100%</text>
  <rect class="track" x="720" y="320" width="800" height="76" rx="6" fill="#F7F7F7" stroke="#E4E4E4"/>
  <rect class="bar" x="720" y="320" width="512" height="76" rx="6" fill="#1F9D55" fill-opacity="0.7"/>
  <text class="label" x="740" y="367" font-size="24" font-weight="600">Checkout started</text>
  <text class="label" x="1500" y="367" font-size="24" font-weight="600" text-anchor="end">64%</text>
  <rect class="track" x="720" y="420" width="800" height="76" rx="6" fill="#F7F7F7" stroke="#E4E4E4"/>
  <rect class="bar" x="720" y="420" width="408" height="76" rx="6" fill="#1F9D55" fill-opacity="0.55"/>
  <text class="label" x="740" y="467" font-size="24" font-weight="600">Shipping info completed</text>
  <text class="label" x="1500" y="467" font-size="24" font-weight="600" text-anchor="end">51%</text>
  <rect class="track" x="720" y="520" width="800" height="76" rx="6" fill="#F7F7F7" stroke="#E4E4E4"/>
  <rect class="bar" x="720" y="520" width="264" height="76" rx="6" fill="#1F9D55" fill-opacity="0.4"/>
  <text class="label" x="740" y="567" font-size="24" font-weight="600">Payment info entered</text>
  <text class="warn" x="1500" y="567" font-size="24" font-weight="600" text-anchor="end">33% · biggest drop</text>
  <rect class="track" x="720" y="620" width="800" height="76" rx="6" fill="#F7F7F7" stroke="#E4E4E4"/>
  <rect class="bar" x="720" y="620" width="216" height="76" rx="6" fill="#1F9D55" fill-opacity="0.3"/>
  <text class="label" x="740" y="667" font-size="24" font-weight="600">Order completed</text>
  <text class="label" x="1500" y="667" font-size="24" font-weight="600" text-anchor="end">27%</text>
</svg>
