<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">AI &amp; AUTOMATION / AGENT SKILLS</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Claude Skills Ecosystem</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: request -->
  <text class="f-muted" x="64" y="178" fill="#5F5F5F" font-size="13" letter-spacing="1.2">PLAIN-ENGLISH REQUEST</text>
  <rect class="f-bg s-accent" rx="6" x="64" y="194" width="1152" height="80" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="230" fill="#1A7F46" font-size="18" font-weight="600">Claude</text>
  <text class="f-heading" x="84" y="256" fill="#111111" font-size="12" font-style="italic">"Tailor my CV for this role"  ·  "Invoice the client for 12 hours"  ·  "Prep me for Thursday's interview"</text>

  <line class="s-accent" x1="640" y1="274" x2="640" y2="320" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: skill router -->
  <rect class="f-box s-line" rx="6" x="64" y="324" width="1152" height="96" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="360" fill="#111111" font-size="18" font-weight="600">Skill matching</text>
  <text class="f-muted" x="84" y="386" fill="#5F5F5F" font-size="12">Each skill's description says when it applies, so the right instructions, references and</text>
  <text class="f-muted" x="84" y="404" fill="#5F5F5F" font-size="12">scripts load only when the task needs them.</text>

  <line class="s-accent" x1="245" y1="420" x2="245" y2="466" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="420" x2="640" y2="466" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1035" y1="420" x2="1035" y2="466" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: skill families -->
  <g font-size="13">
    <rect class="f-box s-accent" rx="6" x="64" y="470" width="362" height="160" fill="#F7F7F7" stroke="#1F9D55"/>
    <text class="f-accent-text" x="84" y="506" fill="#1A7F46" font-size="16" font-weight="600">Document generation</text>
    <text class="f-muted" x="84" y="534" fill="#5F5F5F" font-size="12">ATS-ready tailored CVs</text>
    <text class="f-muted" x="84" y="556" fill="#5F5F5F" font-size="12">Branded PDF invoices</text>
    <text class="f-muted" x="84" y="578" fill="#5F5F5F" font-size="12">Website build guides</text>

    <rect class="f-box s-accent" rx="6" x="459" y="470" width="362" height="160" fill="#F7F7F7" stroke="#1F9D55"/>
    <text class="f-accent-text" x="479" y="506" fill="#1A7F46" font-size="16" font-weight="600">Brand-consistent output</text>
    <text class="f-muted" x="479" y="534" fill="#5F5F5F" font-size="12">Brand guidelines as rules</text>
    <text class="f-muted" x="479" y="556" fill="#5F5F5F" font-size="12">A written personal voice</text>
    <text class="f-muted" x="479" y="578" fill="#5F5F5F" font-size="12">Social image design system</text>

    <rect class="f-box s-accent" rx="6" x="854" y="470" width="362" height="160" fill="#F7F7F7" stroke="#1F9D55"/>
    <text class="f-accent-text" x="874" y="506" fill="#1A7F46" font-size="16" font-weight="600">Structured research</text>
    <text class="f-muted" x="874" y="534" fill="#5F5F5F" font-size="12">Interview prep sheets</text>
    <text class="f-muted" x="874" y="556" fill="#5F5F5F" font-size="12">Recruiter outreach drafts</text>
    <text class="f-muted" x="874" y="578" fill="#5F5F5F" font-size="12">Inbox-to-tracker syncs</text>
  </g>

  <text class="f-muted" x="64" y="692" fill="#5F5F5F" font-size="12">Repeatable work written down once, then run on demand with the same quality every time.</text>
</svg>
