<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">SDK UPLIFT / GUIDED SESSIONS</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">From a 2024 install to clean SDK wiring</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Before -->
  <text class="f-muted" x="64" y="180" fill="#5F5F5F" font-size="13" letter-spacing="1.2">BEFORE</text>
  <rect class="f-box s-line" rx="6" x="64" y="196" width="420" height="300" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="88" y="240" fill="#111111" font-size="18" font-weight="600">Existing OneSignal (2024)</text>
  <text class="f-muted" x="88" y="280" fill="#5F5F5F" font-size="13">• Outdated Web / iOS / Android SDKs</text>
  <text class="f-muted" x="88" y="312" fill="#5F5F5F" font-size="13">• Drifted wiring &amp; init logic</text>
  <text class="f-muted" x="88" y="344" fill="#5F5F5F" font-size="13">• Tied to MS Dynamics 365 stack</text>
  <text class="f-muted" x="88" y="376" fill="#5F5F5F" font-size="13">• Unverified event &amp; tag flow</text>

  <!-- Sessions in the middle -->
  <line class="s-accent" x1="484" y1="346" x2="556" y2="346" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <rect class="f-bg s-accent" rx="6" x="500" y="200" width="280" height="292" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="520" y="238" fill="#1A7F46" font-size="16" font-weight="600">Guided Sessions</text>
  <text class="f-muted" x="520" y="270" fill="#5F5F5F" font-size="12">Portugal-based dev team</text>
  <text class="f-muted" x="520" y="300" fill="#5F5F5F" font-size="12">• SDK update walkthroughs</text>
  <text class="f-muted" x="520" y="326" fill="#5F5F5F" font-size="12">• Init &amp; wiring verification</text>
  <text class="f-muted" x="520" y="352" fill="#5F5F5F" font-size="12">• Data-tagging sessions</text>
  <text class="f-muted" x="520" y="378" fill="#5F5F5F" font-size="12">• AI / real-time translation</text>
  <text class="f-muted" x="520" y="404" fill="#5F5F5F" font-size="12">  (mostly Portuguese)</text>
  <line class="s-accent" x1="780" y1="346" x2="852" y2="346" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- After -->
  <text class="f-muted" x="860" y="180" fill="#5F5F5F" font-size="13" letter-spacing="1.2">AFTER</text>
  <rect class="f-box s-accent" rx="6" x="796" y="196" width="420" height="300" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-heading" x="820" y="240" fill="#111111" font-size="18" font-weight="600">Updated OneSignal SDKs</text>
  <text class="f-muted" x="820" y="280" fill="#5F5F5F" font-size="13">• Current Web / iOS / Android SDKs</text>
  <text class="f-muted" x="820" y="312" fill="#5F5F5F" font-size="13">• Correct init &amp; subscription wiring</text>
  <text class="f-muted" x="820" y="344" fill="#5F5F5F" font-size="13">• Verified events &amp; data tags</text>
  <text class="f-muted" x="820" y="376" fill="#5F5F5F" font-size="13">• Clean base for API &amp; webhooks</text>

  <text class="f-heading" x="64" y="560" fill="#111111" font-size="16" font-weight="600">Instrumented cleanly from the ground up</text>
  <text class="f-muted" x="64" y="592" fill="#5F5F5F" font-size="13">As technical architect I ran the working sessions so every SDK was updated and wired correctly before</text>
  <text class="f-muted" x="64" y="614" fill="#5F5F5F" font-size="13">REST API and webhook work was layered on top.</text>
</svg>
