<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">TECHNICAL ARCHITECTURE / BRAZE</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Braze Implementation Architecture</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: two anonymized clients -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">FINANCIAL-SERVICES CLIENTS — TECHNICAL ARCHITECT</text>
  <g>
    <rect class="f-box s-line" rx="6" x="64" y="186" width="556" height="86" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="224" fill="#111111" font-size="18" font-weight="600">OM Bank (Old Mutual)</text>
    <text class="f-muted" x="84" y="250" fill="#5F5F5F" font-size="12">Inception phase · Braze + mParticle in parallel</text>

    <rect class="f-box s-line" rx="6" x="660" y="186" width="556" height="86" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="680" y="224" fill="#111111" font-size="18" font-weight="600">Wonga</text>
    <text class="f-muted" x="680" y="250" fill="#5F5F5F" font-size="12">Full lifecycle · SDK, API, webhooks, data exports</text>
  </g>

  <line class="s-accent" x1="342" y1="272" x2="500" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="938" y1="272" x2="780" y2="332" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: Braze platform with four pillars -->
  <rect class="f-bg s-accent" rx="6" x="64" y="336" width="1152" height="172" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="372" fill="#1A7F46" font-size="18" font-weight="600">Braze</text>
  <text class="f-muted" x="84" y="396" fill="#5F5F5F" font-size="12">Architecture authored and led across the full Braze surface</text>
  <g font-size="14">
    <rect class="f-box s-line" rx="6" x="84" y="418" width="262" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="104" y="452" fill="#111111" font-weight="600">SDK</text>
    <text class="f-muted" x="104" y="476" fill="#5F5F5F" font-size="12">Web · iOS · Android</text>

    <rect class="f-box s-line" rx="6" x="362" y="418" width="262" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="382" y="452" fill="#111111" font-weight="600">REST API</text>
    <text class="f-muted" x="382" y="476" fill="#5F5F5F" font-size="12">Users · events · messaging</text>

    <rect class="f-box s-line" rx="6" x="640" y="418" width="262" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="660" y="452" fill="#111111" font-weight="600">Webhooks</text>
    <text class="f-muted" x="660" y="476" fill="#5F5F5F" font-size="12">External triggers · SMS</text>

    <rect class="f-box s-line" rx="6" x="918" y="418" width="298" height="72" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="938" y="452" fill="#111111" font-weight="600">Data Exports</text>
    <text class="f-muted" x="938" y="476" fill="#5F5F5F" font-size="12">Currents · downstream sinks</text>
  </g>

  <line class="s-accent" x1="295" y1="508" x2="295" y2="556" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="985" y1="508" x2="985" y2="556" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: congruency + outcome -->
  <rect class="f-box s-line" rx="6" x="64" y="560" width="462" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="594" fill="#111111" font-size="16" font-weight="600">Braze &#8644; mParticle Congruency</text>
  <text class="f-muted" x="84" y="618" fill="#5F5F5F" font-size="12">Aligned identity &amp; event flow —</text>
  <text class="f-muted" x="84" y="636" fill="#5F5F5F" font-size="12">no double-instrumentation</text>

  <rect class="f-box s-accent" rx="6" x="754" y="560" width="462" height="92" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="774" y="594" fill="#1A7F46" font-size="16" font-weight="600">Held Through Rapid Scale</text>
  <text class="f-muted" x="774" y="618" fill="#5F5F5F" font-size="12">140k+ identities unified in 3 months;</text>
  <text class="f-muted" x="774" y="636" fill="#5F5F5F" font-size="12">bank since scaled past 740k (H1 2026)</text>

  <text class="f-muted" x="64" y="694" fill="#5F5F5F" font-size="12">Ran the technical sessions and advised client engineering teams across the full Braze stack.</text>
</svg>
