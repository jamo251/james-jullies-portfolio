<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">KNOWLEDGE SOURCES / WHO CONTRIBUTES WHAT</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Three Systems of Record</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- HubSpot column -->
  <rect class="f-bg s-accent" rx="6" x="64" y="170" width="362" height="392" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="208" fill="#1A7F46" font-size="20" font-weight="600">HubSpot</text>
  <text class="f-muted" x="84" y="232" fill="#5F5F5F" font-size="12">The commercial truth</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="84" y="252" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="104" y="278" fill="#111111">Contacts &amp; companies</text>
    <text class="f-muted" x="104" y="298" fill="#5F5F5F" font-size="11">who's who on the account</text>

    <rect class="f-box s-line" rx="6" x="84" y="320" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="104" y="346" fill="#111111">Deals &amp; pipeline</text>
    <text class="f-muted" x="104" y="366" fill="#5F5F5F" font-size="11">stage, value, close date</text>

    <rect class="f-box s-line" rx="6" x="84" y="388" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="104" y="414" fill="#111111">Owner &amp; activity</text>
    <text class="f-muted" x="104" y="434" fill="#5F5F5F" font-size="11">last touch, next step</text>

    <rect class="f-bg s-accent" rx="6" x="84" y="470" width="322" height="74" fill="#FFFFFF" stroke="#1F9D55" stroke-opacity="0.55"/>
    <text class="f-accent-text" x="104" y="500" fill="#1A7F46" font-size="12">ANSWERS</text>
    <text class="f-muted" x="104" y="524" fill="#5F5F5F" font-size="11">"Where's the deal and who owns it?"</text>
  </g>

  <!-- Notion column -->
  <rect class="f-bg s-accent" rx="6" x="459" y="170" width="362" height="392" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="479" y="208" fill="#1A7F46" font-size="20" font-weight="600">Notion</text>
  <text class="f-muted" x="479" y="232" fill="#5F5F5F" font-size="12">The institutional memory</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="479" y="252" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="499" y="278" fill="#111111">Account plans</text>
    <text class="f-muted" x="499" y="298" fill="#5F5F5F" font-size="11">goals, stakeholders, risks</text>

    <rect class="f-box s-line" rx="6" x="479" y="320" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="499" y="346" fill="#111111">Playbooks &amp; processes</text>
    <text class="f-muted" x="499" y="366" fill="#5F5F5F" font-size="11">how we sell &amp; onboard</text>

    <rect class="f-box s-line" rx="6" x="479" y="388" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="499" y="414" fill="#111111">Meeting &amp; QBR notes</text>
    <text class="f-muted" x="499" y="434" fill="#5F5F5F" font-size="11">what was said &amp; promised</text>

    <rect class="f-bg s-accent" rx="6" x="479" y="470" width="322" height="74" fill="#FFFFFF" stroke="#1F9D55" stroke-opacity="0.55"/>
    <text class="f-accent-text" x="499" y="500" fill="#1A7F46" font-size="12">ANSWERS</text>
    <text class="f-muted" x="499" y="524" fill="#5F5F5F" font-size="11">"What's the plan and the history?"</text>
  </g>

  <!-- Zendesk column -->
  <rect class="f-bg s-accent" rx="6" x="854" y="170" width="362" height="392" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="874" y="208" fill="#1A7F46" font-size="20" font-weight="600">Zendesk</text>
  <text class="f-muted" x="874" y="232" fill="#5F5F5F" font-size="12">The health signal</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="874" y="252" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="894" y="278" fill="#111111">Open tickets</text>
    <text class="f-muted" x="894" y="298" fill="#5F5F5F" font-size="11">what's unresolved now</text>

    <rect class="f-box s-line" rx="6" x="874" y="320" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="894" y="346" fill="#111111">Escalations &amp; SLAs</text>
    <text class="f-muted" x="894" y="366" fill="#5F5F5F" font-size="11">where it's hurting</text>

    <rect class="f-box s-line" rx="6" x="874" y="388" width="322" height="60" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="894" y="414" fill="#111111">Support sentiment</text>
    <text class="f-muted" x="894" y="434" fill="#5F5F5F" font-size="11">tone of recent contact</text>

    <rect class="f-bg s-accent" rx="6" x="874" y="470" width="322" height="74" fill="#FFFFFF" stroke="#1F9D55" stroke-opacity="0.55"/>
    <text class="f-accent-text" x="894" y="500" fill="#1A7F46" font-size="12">ANSWERS</text>
    <text class="f-muted" x="894" y="524" fill="#5F5F5F" font-size="11">"Are they happy or at risk?"</text>
  </g>

  <!-- Converge band -->
  <line class="s-accent" x1="245" y1="562" x2="600" y2="606" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="562" x2="640" y2="606" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1035" y1="562" x2="680" y2="606" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <rect class="f-box s-accent" rx="6" x="320" y="610" width="640" height="56" fill="#F7F7F7" stroke="#1F9D55" stroke-opacity="0.55"/>
  <text class="f-heading" x="340" y="634" fill="#111111" font-size="15" font-weight="600">Commercial + memory + health = the whole client</text>
  <text class="f-muted" x="340" y="656" fill="#5F5F5F" font-size="12">No single platform has the full story — the bot assembles it.</text>

  <text class="f-muted" x="64" y="700" fill="#5F5F5F" font-size="12">Each source is exposed through its own MCP server, so the model pulls only what each question needs.</text>
</svg>
