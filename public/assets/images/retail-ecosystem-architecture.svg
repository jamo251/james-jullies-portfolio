<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">SOLUTION ARCHITECTURE / DATA FLOW</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">Cross-Brand Analytics Stack</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Layer 1: 3 SFCC storefronts -->
  <text class="f-muted" x="64" y="170" fill="#5F5F5F" font-size="13" letter-spacing="1.2">SALESFORCE COMMERCE CLOUD — 3 STOREFRONTS</text>
  <g>
    <rect class="f-box s-line" rx="6" x="64" y="186" width="350" height="78" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="222" fill="#111111" font-size="17" font-weight="600">Cape Union Mart</text>
    <text class="f-muted" x="84" y="246" fill="#5F5F5F" font-size="12">SFCC · data layer</text>

    <rect class="f-box s-line" rx="6" x="465" y="186" width="350" height="78" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="485" y="222" fill="#111111" font-size="17" font-weight="600">Old Khaki</text>
    <text class="f-muted" x="485" y="246" fill="#5F5F5F" font-size="12">SFCC · data layer</text>

    <rect class="f-box s-line" rx="6" x="866" y="186" width="350" height="78" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="886" y="222" fill="#111111" font-size="17" font-weight="600">Poetry</text>
    <text class="f-muted" x="886" y="246" fill="#5F5F5F" font-size="12">SFCC · data layer</text>
  </g>

  <!-- arrows down to GTM -->
  <line class="s-accent" x1="239" y1="264" x2="239" y2="320" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="264" x2="640" y2="320" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1041" y1="264" x2="1041" y2="320" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: GTM / data layer -->
  <rect class="f-box s-line" rx="6" x="64" y="324" width="1152" height="74" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="356" fill="#111111" font-size="17" font-weight="600">Google Tag Manager — Shared Data Layer</text>
  <text class="f-muted" x="84" y="380" fill="#5F5F5F" font-size="12">Normalises dataLayer pushes from every storefront into a common event shape</text>

  <line class="s-accent" x1="640" y1="398" x2="640" y2="430" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: Unified taxonomy -->
  <rect class="f-box s-accent" rx="6" x="64" y="434" width="1152" height="74" fill="#F7F7F7" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="466" fill="#1A7F46" font-size="17" font-weight="600">Unified Event Taxonomy</text>
  <text class="f-muted" x="84" y="490" fill="#5F5F5F" font-size="12">One governed Object–Action spec · brand distinguished by property, not by schema fork</text>

  <line class="s-accent" x1="640" y1="508" x2="640" y2="540" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Layer 4: Amplitude -->
  <text class="f-muted" x="64" y="534" fill="#5F5F5F" font-size="13" letter-spacing="1.2"></text>
  <rect class="f-bg s-line" rx="6" x="64" y="544" width="1152" height="120" fill="#FFFFFF" stroke="#E4E4E4"/>
  <text class="f-heading" x="84" y="578" fill="#111111" font-size="17" font-weight="600">Amplitude</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="84" y="596" width="340" height="48" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="104" y="625" fill="#1A7F46">Funnel Analysis</text>
    <rect class="f-box s-line" rx="6" x="448" y="596" width="340" height="48" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="468" y="625" fill="#1A7F46">Cross-Brand Dashboards</text>
    <rect class="f-box s-line" rx="6" x="812" y="596" width="384" height="48" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-accent-text" x="832" y="625" fill="#1A7F46">Retention &amp; Cohorts</text>
  </g>

  <text class="f-muted" x="64" y="698" fill="#5F5F5F" font-size="12">Architected and guided the Amplitude instrumentation rollout across all three brands.</text>
</svg>
