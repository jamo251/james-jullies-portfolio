<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg:#FFFFFF; --box:#F7F7F7; --line:#E4E4E4; --line-strong:#CFCFCF; --heading:#111111; --text:#2B2B2B; --muted:#5F5F5F; --accent:#1F9D55; --accent-text:#1A7F46; --warn:#C2410C; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F0F10; --box:#18181A; --line:#2C2C2E; --line-strong:#3E3E42; --heading:#FFFFFF; --text:#E6E6E6; --muted:#A3A3A3; --accent:#3FCF7F; --accent-text:#3FCF7F; --warn:#FB923C; }
    }
    .f-bg{fill:var(--bg)} .f-box{fill:var(--box)} .f-heading{fill:var(--heading)} .f-muted{fill:var(--muted)}
    .f-accent{fill:var(--accent)} .f-accent-text{fill:var(--accent-text)} .f-warn{fill:var(--warn)}
    .s-line{stroke:var(--line)} .s-line-strong{stroke:var(--line-strong)} .s-accent{stroke:var(--accent)} .s-warn{stroke:var(--warn)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect class="f-bg" width="1280" height="720" fill="#FFFFFF"/>

  <text class="f-muted" x="64" y="68" fill="#5F5F5F" font-size="14" letter-spacing="1.6">FLOW / ONE PROMPT, ONE ANSWER</text>
  <text class="f-heading" x="64" y="110" fill="#111111" font-size="30" font-weight="600">The Lifecycle of a Question</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path class="f-accent" d="M0,0 L8,3 L0,6 Z" fill="#1F9D55"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <text class="f-muted" x="64" y="180" fill="#5F5F5F" font-size="13" letter-spacing="1.2">01 — PROMPT</text>
  <rect class="f-bg s-accent" rx="6" x="64" y="196" width="540" height="120" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="84" y="232" fill="#1A7F46" font-size="16" font-weight="600">A rep asks in Slack</text>
  <text class="f-muted" x="84" y="260" fill="#5F5F5F" font-size="12">"Prep me for the Acme renewal call"</text>
  <text class="f-muted" x="84" y="284" fill="#5F5F5F" font-size="12">Natural language — no syntax, no platform knowledge needed.</text>

  <line class="s-accent" x1="604" y1="256" x2="736" y2="256" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <text class="f-muted" x="736" y="180" fill="#5F5F5F" font-size="13" letter-spacing="1.2">02 — PLAN</text>
  <rect class="f-box s-line" rx="6" x="736" y="196" width="480" height="120" fill="#F7F7F7" stroke="#E4E4E4"/>
  <text class="f-heading" x="756" y="232" fill="#111111" font-size="16" font-weight="600">The Claude API routes</text>
  <text class="f-muted" x="756" y="260" fill="#5F5F5F" font-size="12">Decides which MCP tools to call and in what</text>
  <text class="f-muted" x="756" y="278" fill="#5F5F5F" font-size="12">order to answer the question.</text>

  <line class="s-accent" x1="976" y1="316" x2="976" y2="362" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 3 - parallel fetch -->
  <text class="f-muted" x="64" y="356" fill="#5F5F5F" font-size="13" letter-spacing="1.2">03 — FETCH IN PARALLEL VIA MCP</text>
  <g font-size="13">
    <rect class="f-box s-line" rx="6" x="64" y="372" width="362" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="84" y="404" fill="#111111" font-weight="600">HubSpot</text>
    <text class="f-muted" x="84" y="428" fill="#5F5F5F" font-size="12">Open deal, renewal date,</text>
    <text class="f-muted" x="84" y="446" fill="#5F5F5F" font-size="12">owner, deal stage</text>

    <rect class="f-box s-line" rx="6" x="459" y="372" width="362" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="479" y="404" fill="#111111" font-weight="600">Notion</text>
    <text class="f-muted" x="479" y="428" fill="#5F5F5F" font-size="12">Account plan, last QBR</text>
    <text class="f-muted" x="479" y="446" fill="#5F5F5F" font-size="12">notes, success criteria</text>

    <rect class="f-box s-line" rx="6" x="854" y="372" width="362" height="92" fill="#F7F7F7" stroke="#E4E4E4"/>
    <text class="f-heading" x="874" y="404" fill="#111111" font-weight="600">Zendesk</text>
    <text class="f-muted" x="874" y="428" fill="#5F5F5F" font-size="12">Open tickets, recent</text>
    <text class="f-muted" x="874" y="446" fill="#5F5F5F" font-size="12">escalations &amp; sentiment</text>
  </g>

  <line class="s-accent" x1="245" y1="464" x2="500" y2="516" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="640" y1="464" x2="640" y2="516" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line class="s-accent" x1="1035" y1="464" x2="780" y2="516" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 4 - synthesis -->
  <text class="f-muted" x="64" y="510" fill="#5F5F5F" font-size="13" letter-spacing="1.2">04 — SYNTHESISE</text>
  <rect class="f-bg s-accent" rx="6" x="320" y="520" width="640" height="64" fill="#FFFFFF" stroke="#1F9D55"/>
  <text class="f-accent-text" x="340" y="552" fill="#1A7F46" font-size="16" font-weight="600">Reconcile into one coherent picture</text>
  <text class="f-muted" x="340" y="574" fill="#5F5F5F" font-size="12">Disparate facts from three platforms, stitched and de-duplicated.</text>

  <line class="s-accent" x1="640" y1="584" x2="640" y2="612" stroke="#1F9D55" stroke-opacity="0.8" marker-end="url(#arrow)"/>

  <!-- Step 5 - reply -->
  <rect class="f-box s-accent" rx="6" x="320" y="616" width="640" height="56" fill="#F7F7F7" stroke="#1F9D55" stroke-opacity="0.55"/>
  <text class="f-heading" x="340" y="640" fill="#111111" font-size="15" font-weight="600">05 — One unified reply, back in the Slack thread</text>
  <text class="f-muted" x="340" y="662" fill="#5F5F5F" font-size="12">Seconds, not a round of logins across three tabs.</text>
</svg>
